name: Frontend safety tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frontend regression tests
        run: npm test
      - name: Run local booking integration tests
        run: npm run test:local-booking
      - name: Verify production build
        run: npm run build
